name: Live demo

# Builds the made-up family in examples/hartwell and publishes it with GitHub Pages, so there is always a demo
# of what the current code produces. Needs Settings > Pages > Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "examples/**"
      - ".github/workflows/demo.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv run cronicl build -C examples/hartwell --out "$RUNNER_TEMP/public"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
