[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cronicl"  # PyPI name taken: choose a distribution name before publishing
version = "0.1.0"
description = "Markdown family tree to static site generator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0", "Jinja2>=3.1", "markdown-it-py>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cronicl = "cronicl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cronicl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
