[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cronicl"  # PyPI name taken: choose a distribution name before publishing
version = "0.1.0"
description = "Your family tree as plain text you own: edit it in a friendly terminal app, check it for mistakes, trade GEDCOM, and publish it as a website"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "markdown-it-py>=3.0",
    "textual>=8.2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/cbenning/cronicl"

[project.scripts]
cronicl = "cronicl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cronicl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
