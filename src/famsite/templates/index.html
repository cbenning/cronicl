<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <h1>{{ title }}</h1>
  <nav id="tabs" aria-label="Views">
    <a href="#/tree" data-view="tree">Tree</a>
    <a href="#/timeline" data-view="timeline">Timeline</a>
  </nav>
  <input id="search" type="search" placeholder="Search people" autocomplete="off" aria-label="Search people">
  <ul id="results" hidden></ul>
</header>
<main>
  <div id="views">
    <div id="focus-bar" hidden></div>
    <div id="legend" hidden role="group" aria-label="What the colours mean"></div>
    <svg id="tree" role="img" aria-label="Family tree"></svg>
    <section id="timeline" hidden>
      <div id="timeline-head"></div>
      <svg id="timeline-svg" role="img" aria-label="Timeline"></svg>
      <div id="timeline-scroll" hidden aria-hidden="true"><div class="thumb"></div></div>
      <details id="undated" hidden></details>
    </section>
  </div>
  <aside id="panel" hidden></aside>
</main>
<noscript>
  <ul class="plain-list">
  {% for person in people %}
    <li><a href="p/{{ person.id }}/">{{ person.name }}</a> {{ person.years }}</li>
  {% endfor %}
  </ul>
</noscript>
<script src="viewer.js"></script>
</body>
</html>
