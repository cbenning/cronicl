<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="famsite-home" content="{{ home or '' }}">
<meta name="famsite-root" content="{{ root }}">
<title>{{ title }}</title>
<link rel="stylesheet" href="style.css?v={{ v.css }}">
</head>
<body>
<header class="bar">
  <h1><a href="index.html">{{ title }}</a></h1>
  <nav id="tabs" aria-label="Views">
    <a href="#/tree" data-view="focus">Tree</a>
    <a href="#/tree" data-view="tree">Overview</a>
    <a href="#/timeline" data-view="timeline">Timeline</a>
  </nav>
  <a class="bar-link" href="people/index.html">People</a>
  <input id="search" type="search" placeholder="Search people" autocomplete="off" aria-label="Search people">
  <ul id="results" hidden></ul>
</header>
<main>
  <div id="views">
    <div id="focus-bar" hidden></div>
    <div id="legend" hidden role="group" aria-label="What the colours mean"></div>
    <div id="tree-controls" role="group" aria-label="Zoom" hidden>
      <button type="button" data-act="zoom-in" aria-label="Zoom in">+</button>
      <button type="button" data-act="zoom-out" aria-label="Zoom out">−</button>
      <button type="button" data-act="fit" aria-label="Fit the whole tree">Fit</button>
      <button type="button" data-act="home" aria-label="Go to the home person">Home</button>
    </div>
    <svg id="tree" role="img" aria-label="Family tree"></svg>
    <section id="timeline" hidden>
      <div id="timeline-head"></div>
      <svg id="timeline-svg" role="img" aria-label="Timeline"></svg>
      <div id="timeline-scroll" hidden aria-hidden="true"><div class="thumb"></div></div>
      <details id="undated" hidden></details>
    </section>
  </div>
  <aside id="panel" hidden></aside>
</main>
<noscript>
  <ul class="plain-list">
  {% for person in people %}
    <li><a href="p/{{ person.id }}/">{{ person.name }}</a> {{ person.years }}</li>
  {% endfor %}
  </ul>
</noscript>
<script src="kin.js?v={{ v.kin }}"></script>
<script src="site.js?v={{ v.site }}"></script>
<script src="viewer.js?v={{ v.js }}"></script>
</body>
</html>
