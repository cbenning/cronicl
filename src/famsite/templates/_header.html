<header class="site-bar">
  <a class="site-title" href="{{ root }}index.html">{{ title }}</a>
  <nav aria-label="Site">
    <a href="{{ root }}index.html"{% if active == 'home' %} aria-current="page"{% endif %}>Home</a>
    <a href="{{ root }}tree/"{% if active == 'tree' %} aria-current="page"{% endif %}>Tree</a>
    <a href="{{ root }}timeline/"{% if active == 'timeline' %} aria-current="page"{% endif %}>Timeline</a>
    <a href="{{ root }}people/index.html"{% if active == 'people' %} aria-current="page"{% endif %}>People</a>
    <a href="{{ root }}places/index.html"{% if active == 'places' %} aria-current="page"{% endif %}>Places</a>
  </nav>
  <form class="site-search" action="{{ root }}people/index.html" method="get" role="search">
    <input type="search" name="q" aria-label="Search people" placeholder="Search people">
  </form>
</header>
