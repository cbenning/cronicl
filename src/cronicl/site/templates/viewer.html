<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="cronicl-home" content="{{ home or '' }}">
<meta name="cronicl-root" content="{{ root }}">
<title>{{ title }}</title>
<link rel="stylesheet" href="{{ root }}style.css?v={{ v.css }}">
</head>
<body data-page="{{ page }}">
{% include "_header.html" %}
<div class="bar viewbar">
  {% if page == 'tree' %}
  <div id="modes" role="group" aria-label="What the tree shows">
    <a href="#" data-mode="all">Everyone</a>
    <a href="#" data-mode="line">This person's line</a>
  </div>
  {% endif %}
  <input id="search" type="search" placeholder="Find in the {{ page }}" autocomplete="off" aria-label="Find a person in the {{ page }}">
  <ul id="results" hidden></ul>
</div>
<main>
  <div id="views">
    <div id="focus-bar" hidden></div>
    <div id="legend" hidden role="group" aria-label="What the colours mean"></div>
    <div id="tree-controls" role="group" aria-label="Zoom" hidden>
      <button type="button" data-act="zoom-in" aria-label="Zoom in">+</button>
      <button type="button" data-act="zoom-out" aria-label="Zoom out">−</button>
      <button type="button" data-act="fit" aria-label="Fit the whole tree">Fit</button>
      <button type="button" data-act="home" aria-label="Go to the home person">Home</button>
    </div>
    <svg id="tree" role="img" aria-label="Family tree"></svg>
    <section id="timeline" hidden>
      <div id="timeline-head"></div>
      <div id="timeline-body">
        <svg id="timeline-axis" aria-hidden="true"></svg>
        <div id="timeline-rows"><svg id="timeline-svg" role="img" aria-label="Timeline"></svg></div>
      </div>
      <div id="timeline-scroll" hidden aria-hidden="true"><div class="thumb"></div></div>
      <details id="undated" hidden></details>
    </section>
  </div>
  <aside id="panel" hidden></aside>
</main>
<noscript>
  <ul class="plain-list">
  {% for person in people %}
    <li><a href="{{ root }}p/{{ person.id }}/">{{ person.name }}</a> {{ person.years }}</li>
  {% endfor %}
  </ul>
</noscript>
<script src="{{ root }}kin.js?v={{ v.kin }}"></script>
<script src="{{ root }}site.js?v={{ v.site }}"></script>
<script src="{{ root }}viewer.js?v={{ v.js }}"></script>
</body>
</html>
