<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
{% if noindex %}<meta name="robots" content="noindex, nofollow">
{% endif %}<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="cronicl-home" content="{{ home or '' }}">
<meta name="cronicl-root" content="{{ root }}">
<title>{{ map.label }} — {{ title }}</title>
<link rel="stylesheet" href="{{ root }}style.css?v={{ v.css }}">
<script src="{{ root }}map.js?v={{ v.map }}" defer></script>
<script src="{{ root }}site.js?v={{ v.site }}" defer></script>
</head>
<body class="site-page map-page">
{% include "_header.html" %}
<main class="index">
  <h1>{{ map.label }}</h1>
  <p id="map-status" class="lede">Loading the map…</p>
  <noscript><p>The map needs JavaScript. The <a href="{{ root }}places/index.html">places page</a> lists the same places.</p></noscript>
  <p class="lede map-note">This page loads map tiles from {{ map.tiles.split('/')[2] }}, which sees your address and the area you look at.</p>
  <div class="map-layout">
    <div id="map" data-tiles="{{ map.tiles }}" data-attribution="{{ map.attribution }}" data-root="{{ root }}"></div>
    <aside id="map-list" aria-live="polite" hidden></aside>
  </div>
</main>
</body>
</html>
